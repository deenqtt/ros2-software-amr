# opennav_docking configuration for AMR charging dock
#
# Dock position: (-4.0, -4.0) in map frame, facing east (yaw=0)
# Robot approaches from x+ direction and backs into dock.
#
# To add more docks, duplicate the docks section with unique names.

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Dock plugins — SimpleChargingDock works with a fixed known position
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false

    # Defined docks
    docks: ["charging_station"]
    charging_station:
      type: "simple_charging_dock"
      frame: "map"
      pose: [-4.0, -4.0, 0.0] # [x, y, yaw_radians]

    navigator_bt_node: ""

controller:
  ros__parameters:
    use_sim_time: true
