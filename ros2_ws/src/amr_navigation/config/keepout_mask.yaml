# Keepout filter mask configuration
# This file defines the filter info topic for Nav2 keepout filter.
# The actual keepout zones are defined in keepout_mask.pgm / keepout_mask_map.yaml
# and published via the costmap_filter_info_server node.
#
# Web UI can update keepout zones by:
#   1. Sending polygon coordinates to a custom service
#   2. Regenerating the PGM mask
#   3. Calling /lifecycle_manager/manage_nodes to reload costmap

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    # Type 1 = keepout filter (binary mask)
    type: 1
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
