[project]
name = "amr-backend"
version = "0.1.0"
description = "AMR fleet control backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "python-multipart==0.0.20",
    "pyyaml==6.0.2",
]

[project.scripts]
# Installed into the venv, so `amr-backend` works once the package is installed.
amr-backend = "app.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "ruff==0.14.0",
]

# Declared explicitly. With flat-layout auto-discovery, setuptools refuses to
# build as soon as a second top-level directory appears — and `data/` appears
# the first time anyone starts the server.
[tool.setuptools.packages.find]
include = ["app*"]

# The migration runner reads these at runtime, so they must ship with the
# package and not only exist in the source tree.
[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
# S101: pytest uses bare assert.
per-file-ignores = { "tests/*" = ["S101"] }
