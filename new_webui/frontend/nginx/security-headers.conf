# Security headers for every response of the AMR web UI.
#
# nginx gotcha: a location with any add_header of its own inherits NONE of the
# server's add_header lines. So this file is included at server level AND in
# every location that sets its own header (Cache-Control below). Add a header
# to a location → include this file there too.
#
# Needs $amr_hsts, defined in http context (default.conf.template does it):
#   map $scheme $amr_hsts { https "max-age=31536000"; default ""; }
# nginx sends no header at all for an empty value, so HSTS goes out over HTTPS
# only — never on plain HTTP, where it would mean nothing to the browser.
#
# CSP, checked against the built app (dist/): one module script and one
# stylesheet from /assets, no inline script, no eval. (roslib's bundle holds a
# blob: Worker for its optional workersocket transport; the app never uses it.)
# Inline styles are needed (Vue :style bindings). Fonts come from Google Fonts
# (index.html). The ROS relay WebSocket is same-origin
# (/backend/api/robots/<id>/ros). CSP Level 3 browsers count that as 'self';
# older ones need ws:/wss: for this host spelled out, and stop and E-STOP travel
# over that socket, so both are listed. Map images are data:/blob: URLs.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "gamepad=(self), camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $amr_hsts always;
